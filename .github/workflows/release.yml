name: Release
on:
  push:
    branches: [master, main]
    tags: ["**"]
jobs:
  publish:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '#docs') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: |
          if [[ -z "${{ secrets.PGP_PASSPHRASE }}" ]]; then
            echo "PGP_PASSPHRASE  does not exist"
          else
            echo "PGP_PASSPHRASE  exists"
          fi
          
          if [[ -z "${{ secrets.PGP_SECRET }}" ]]; then
            echo "PGP_SECRET does not exist"
          else
            echo "PGP_SECRET exists"
          fi
          
          if [[ -z "${{ secrets.SONATYPE_PASSWORD }}" ]]; then
            echo "SONATYPE_PASSWORD does not exist"
          else
            echo "SONATYPE_PASSWORD exists"
          fi
          
          if [[ -z "${{ secrets.SONATYPE_USERNAME }}" ]]; then
            echo "SONATYPE_USERNAME does not exist"
          else
            echo "SONATYPE_USERNAME exists"
          fi
